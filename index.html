<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Single-Y Line Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h3 { margin-bottom: 1rem; }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 250px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 420px;
      margin-top: 1.5rem;
    }

    .control label {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #28a745;
    }

    .val {
      text-align: right;
      font-size: 0.9rem;
      color: #444;
      margin-top: 0.2rem;
    }

    .yvalue {
      margin-top: 1rem;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h3>Interactive Risk Assessment</h3>

  <div class="chart-container">
    <canvas id="lineChart"></canvas>
  </div>

  <div class="controls">
    <div class="control">
      <label>Height</label>
      <input type="range" id="s1" min="0" max="100" value="50">
      <div class="val" id="v1">50</div>
    </div>
    <div class="control">
      <label>Weight</label>
      <input type="range" id="s2" min="0" max="100" value="50">
      <div class="val" id="v2">50</div>
    </div>
    <div class="control">
      <label>Age</label>
      <input type="range" id="s3" min="0" max="100" value="50">
      <div class="val" id="v3">50</div>
    </div>
  </div>

  <div class="yvalue">Risk Level: <span id="yVal">50</span></div>

<script>
const ctx = document.getElementById('lineChart').getContext('2d');

// initialize chart with one dataset
const data = {
  labels: Array.from({length: 10}, (_, i) => i + 1), // x-axis from 1 to 10
  datasets: [{
    label: 'Combined Y Value',
    data: Array(10).fill(50),
    borderColor: '#28a745',
    backgroundColor: 'rgba(40, 167, 69, 0.2)',
    borderWidth: 3,
    tension: 0.3,
    fill: true
  }]
};

const config = {
  type: 'line',
  data,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: { y: { beginAtZero: true, max: 100 } },
    plugins: { legend: { display: false } },
    animation: { duration: 250 }
  }
};

const chart = new Chart(ctx, config);

// Function to compute combined Y (average)
function computeY() {
  const s1 = Number(document.getElementById('s1').value);
  const s2 = Number(document.getElementById('s2').value);
  const s3 = Number(document.getElementById('s3').value);
  const avg = (s1 + s2 + s3) / 3;
  return avg;
}

// Update chart whenever any slider changes
function updateChart() {
  const newY = computeY();
  document.getElementById('yVal').textContent = newY.toFixed(1);

  // update text values for sliders
  ['1','2','3'].forEach(i => {
    document.getElementById('v'+i).textContent =
      document.getElementById('s'+i).value;
  });

  // update line to reflect new Y (flat line across all x)
  chart.data.datasets[0].data = Array(10).fill(newY);
  chart.update();
}

// Connect sliders
['s1','s2','s3'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateChart);
});
</script>
</body>
</html>
