<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Line Chart (Mobile Friendly)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h3 { margin-bottom: 1rem; }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 250px; /* keeps it readable on phones */
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1rem;
      width: 100%;
      max-width: 420px;
      margin-top: 1.2rem;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .control label {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #007bff;
    }

    .val {
      text-align: right;
      font-size: 0.9rem;
      color: #444;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h3>Interactive Line Chart</h3>

  <div class="chart-container">
    <canvas id="lineChart"></canvas>
  </div>

  <div class="controls">
    <div class="control">
      <label>Point A</label>
      <input type="range" id="s1" min="0" max="100" value="25">
      <div class="val" id="v1">25</div>
    </div>
    <div class="control">
      <label>Point B</label>
      <input type="range" id="s2" min="0" max="100" value="50">
      <div class="val" id="v2">50</div>
    </div>
    <div class="control">
      <label>Point C</label>
      <input type="range" id="s3" min="0" max="100" value="75">
      <div class="val" id="v3">75</div>
    </div>
    <div class="control">
      <label>Point D</label>
      <input type="range" id="s4" min="0" max="100" value="100">
      <div class="val" id="v4">100</div>
    </div>
  </div>

<script>
const ctx = document.getElementById('lineChart').getContext('2d');
const data = {
  labels: ['A','B','C','D'],
  datasets: [{
    label: 'Y Value',
    data: [25,50,75,100],
    borderColor: '#007bff',
    backgroundColor: 'rgba(0,123,255,0.2)',
    borderWidth: 3,
    tension: 0.3,        // curved line
    fill: true,          // fill under the line
    pointRadius: 6,
    pointHoverRadius: 8
  }]
};

const config = {
  type: 'line',
  data,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      y: { beginAtZero: true, max: 100 },
      x: { grid: { display: false } }
    },
    plugins: { legend: { display: false } },
    animation: { duration: 250 }
  }
};

const chart = new Chart(ctx, config);

// Connect sliders → update chart
function connectSlider(sliderId, valueId, index) {
  const slider = document.getElementById(sliderId);
  const valueDisplay = document.getElementById(valueId);
  slider.addEventListener('input', () => {
    const val = Number(slider.value);
    valueDisplay.textContent = val;
    chart.data.datasets[0].data[index] = val;
    chart.update();
  });
}

connectSlider('s1', 'v1', 0);
connectSlider('s2', 'v2', 1);
connectSlider('s3', 'v3', 2);
connectSlider('s4', 'v4', 3);
</script>
</body>
</html>
