<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bar Chart (Mobile Friendly)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Chart container ensures it scales */
    .chart-container {
      position: relative;
      width: 100%;
      max-width: 400px; /* fits phones comfortably */
    }

    canvas {
      width: 100% !important;
      height: auto !important;
    }

    /* Sliders arranged vertically */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
      margin-top: 1.5rem;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .control label {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: teal;
    }

    .val {
      text-align: right;
      font-size: 0.9rem;
      color: #444;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h3>Interactive Bar Chart</h3>

  <div class="chart-container">
    <canvas id="barChart"></canvas>
  </div>

  <div class="controls">
    <div class="control">
      <label>Height</label>
      <input type="range" id="s1" min="0" max="100" value="50">
      <div class="val" id="v1">50</div>
    </div>
    <div class="control">
      <label>Wwight</label>
      <input type="range" id="s2" min="0" max="100" value="50">
      <div class="val" id="v2">50</div>
    </div>
    <div class="control">
      <label>Age</label>
      <input type="range" id="s3" min="0" max="100" value="50">
      <div class="val" id="v3">50</div>
    </div>


<script>
const ctx = document.getElementById('barChart').getContext('2d');
const data = {
  labels: ['Height','Weight','Age'],
  datasets: [{
    label: 'Value',
    data: [50,50,50],
    backgroundColor: 'rgba(75, 192, 192, 0.7)',
    borderWidth: 1
  }]
};
const cfg = {
  type: 'bar',
  data,
  options: {
    maintainAspectRatio: false,
    responsive: true,
    scales: { y: { beginAtZero: true, max: 100 } },
    plugins: { legend: { display: false } }
  }
};
const chart = new Chart(ctx, cfg);

function wire(idS, idV, idx) {
  const s = document.getElementById(idS);
  const v = document.getElementById(idV);
  s.addEventListener('input', () => {
    const val = Number(s.value);
    v.textContent = val;
    chart.data.datasets[0].data[idx] = val;
    chart.update();
  });
}
wire('s1','v1',0);
wire('s2','v2',1);
wire('s3','v3',2);
</script>
</body>
</html>
